<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
    <link href="styles.css" rel="stylesheet">
  </head>
  <body>
    <div class="perspective-container">
      <div class="carousel-container">
        <img src="images/A-close-up-of-a-woman_s-shoulder-with-flowers-on-it.jpeg" loading="lazy">
        <img src="images/A-scenic-view-of-a-house-in-the-mountains.jpeg" loading="lazy">
        <img src="images/A-town-by-a-lake.jpeg" loading="lazy" >
        <img src="images/A-woman-with-long-hair.jpg" loading="lazy">
        <img src="images/Cherry-blossoms-frame-the-moon-in-a-twilight-sky.jpeg" loading="lazy">
        <img src="images/Cozy-room-with-a-view-of-green-fields.jpeg" loading="lazy">
        <img src="images/people-dine-at-an-outdoor-restaurant-at-night.jpeg" loading="lazy">
        <img src="images/Woman-in-white-long-sleeve-shirt-smiling.jpeg" loading="lazy">
      </div>

      <div class="deck-container">
        <img src="images/A-close-up-of-a-woman_s-shoulder-with-flowers-on-it.jpeg" loading="lazy">
        <img src="images/A-scenic-view-of-a-house-in-the-mountains.jpeg" loading="lazy">
        <img src="images/A-town-by-a-lake.jpeg" loading="lazy">
        <img src="images/A-woman-with-long-hair.jpg" loading="lazy">
        <img src="images/Cherry-blossoms-frame-the-moon-in-a-twilight-sky.jpeg" loading="lazy">
        <img src="images/Cozy-room-with-a-view-of-green-fields.jpeg" loading="lazy">
        <img src="images/people-dine-at-an-outdoor-restaurant-at-night.jpeg" loading="lazy">
        <img src="images/Woman-in-white-long-sleeve-shirt-smiling.jpeg" loading="lazy">
      </div>
    </div>
    <div class="btn-container">
      <button class="prev-btn">Previous</button>
      <button class="nxt-btn">Next</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
